name: Publish to NPM Registry
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    environment: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          node-version: 24

      - name: Install packages
        shell: bash
        run: |
          pnpm install

          if ! test -z "`git diff --stat`"; then
            echo "Changes were found; please run 'pnpm install' and commit the output."
            echo
            git diff --name-only
            exit 1
          fi

      - name: Bump version
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          NEW_VERSION="$(npm version ${{ inputs.bump }} --no-git-tag-version)"
          git add package.json
          git commit -m "Release ${NEW_VERSION}"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "branch=release/${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm run build

      - name: Publish package on NPM 📦
        run: NODE_AUTH_TOKEN="" pnpm publish --access public

      - name: Open version PR and auto-merge it
        env:
          # NOTE: need a PAT: a PR opened by GITHUB_TOKEN doesn't start
          # the CI run that `main` requires, so auto-merge would never fire.
          # GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git push origin "HEAD:refs/heads/${BRANCH}"

          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "${BRANCH}" \
            --title "Release ${VERSION}" \
            --body "Version bump for ${VERSION}, published from run ${{ github.run_id }}."

          gh pr merge "${BRANCH}" --auto --squash
